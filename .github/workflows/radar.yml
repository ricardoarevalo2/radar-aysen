name: Radar Compra Agil

on:
  schedule:
    # Cada hora entre 06:30 y 21:30 (hora de Aysén, UTC-3). GitHub puede atrasarse unos minutos.
    - cron: "30 0,9-23 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el radar
        env:
          COMPRA_AGIL_TICKET: ${{ secrets.COMPRA_AGIL_TICKET }}
          RADAR_MODO: web
          run: python -u radar_compra_agil.py

      - name: Publicar el reporte
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs cache_compras.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Radar: actualización $(TZ=America/Punta_Arenas date '+%d-%m %H:%M')"
          git push
